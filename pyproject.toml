[project]
name = "mrphantom"
version = "0.4.0"
description = "Synthetic MRI diffusion-weighted phantom synthesis library and CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"click>=8.1",
	"numpy>=1.26",
	"nibabel>=5.0",
	"h5py>=3.10.0",
	"tomli>=1.2; python_version < '3.11'",
]

[project.scripts]
mrphantom="mrphantom.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"