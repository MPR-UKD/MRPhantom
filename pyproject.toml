[project]
name = "mrphantom"
version = "0.4.0"
description = "Synthetic MRI diffusion-weighted phantom synthesis library and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Thiel" }]
keywords = ["mri", "dwi", "diffusion", "phantom", "synthetic", "intravoxel-incoherent-motion", "monte-carlo"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = [
	"click>=8.1",
	"numpy>=1.26",
	"nibabel>=5.0",
	"h5py>=3.10.0",
	"tomli>=1.2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/MRP-UKD/MRPhantom"
Issues = "https://github.com/MRP-UKD/MRPhantom/issues"
Changelog = "https://github.com/MRP-UKD/MRPhantom/blob/main/CHANGELOG.md"

[project.scripts]
mrphantom="mrphantom.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
